apiVersion: v1
kind: Secret
metadata:
  name: quickcache-state-backup
  namespace: kube-system
type: Opaque
stringData:
  # Use separate backup credentials. Never commit the filled-in file.
  AWS_ACCESS_KEY_ID: REPLACE_WITH_CUSTOMER_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_CUSTOMER_SECRET_KEY
  AWS_DEFAULT_REGION: sa-saopaulo-1
  S3_ENDPOINT_URL: https://YOUR_NAMESPACE.compat.objectstorage.sa-saopaulo-1.oraclecloud.com
  S3_BUCKET: YOUR_PRIVATE_STATE_BACKUP_BUCKET
